name: Smoke Tests

on:
  # Vercel reports a GitHub deployment for every preview build. Triggering on
  # its status means we run once the preview URL is actually live, rather than
  # racing the build the way `pull_request` would.
  deployment_status:

  # Manual runs against any environment. Only selectable once this file is on
  # the default branch.
  workflow_dispatch:
    inputs:
      base_url:
        description: Environment to test, e.g. https://staging.researchhub.com
        required: true

concurrency:
  group: smoke-${{ github.event.deployment_status.target_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    # deployment_status fires for every state transition, so ignore everything
    # that is not a live deployment. Previews only - drop the environment check
    # to also smoke production after a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment != 'Production')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ github.event.deployment_status.target_url || inputs.base_url }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: npm run test:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
