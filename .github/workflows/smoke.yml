name: Smoke Tests

on:
  # Manual runs only, from the Actions tab or `gh workflow run`, against any
  # environment. Pull requests no longer trigger it.
  workflow_dispatch:
    inputs:
      base_url:
        description: Environment to test, e.g. https://staging.researchhub.com
        required: true

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc is gitignored because it carries registry credentials, so the
      # runner has to build its own. Both private registries are needed: Tiptap
      # Pro and FontAwesome Pro packages are dependencies of the app.
      - name: Configure private registries
        env:
          TIPTAP_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
          FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
        run: |
          cat > .npmrc <<EOF
          @tiptap-pro:registry=https://registry.tiptap.dev/
          //registry.tiptap.dev/:_authToken=${TIPTAP_TOKEN}
          @awesome.me:registry=https://npm.fontawesome.com/
          @fortawesome:registry=https://npm.fontawesome.com/
          //npm.fontawesome.com/:_authToken=${FONTAWESOME_TOKEN}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          # The URL comes from the run's input.
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          # Ids of the fixture content, which is public.
          SMOKE_GRANT_POST_ID: ${{ vars.SMOKE_GRANT_POST_ID }}
          SMOKE_PROPOSAL_POST_ID: ${{ vars.SMOKE_PROPOSAL_POST_ID }}
        run: npm run test:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
